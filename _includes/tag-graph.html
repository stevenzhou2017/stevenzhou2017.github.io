<div class="tag-graph">
  <h3> Related Tags (Graph View)</h3>

  {% assign current_tags = page.tags %}

  <ul>
  {% for tag in current_tags %}
    <li>
      <a href="/tags/{{ tag }}/">{{ tag }}</a>

      <ul>
        {% for post in site.tags[tag] limit:3 %}
          <li>
            <a href="{{ post.url }}">{{ post.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </li>
  {% endfor %}
  </ul>
</div>
