title: 周均扬博士 | Dr. Junyang Zhou
description: 工业AI与智能制造专家 | 25+年AI领导经验 | 锂电池智能制造 | 具身智能
url: "https://stevenzhou2017.github.io"
baseurl: ""

timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap

# ==================== 重要：排除不需要的内容 ====================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - github-recovery-codes.html
  - cgi-bin/
  - assets/
  - header.html
  - footer.html
  - docs/2025/
  - docs/2026/              # 先全部排除笔记页（等你完善后再逐步放开）
  - docs/
  - download/               # PDF 文件太多，建议不放进 sitemap
  - test.html


# ==================== 只收录核心高质量页面 ====================
defaults:
  - scope:
      path: ""              # 所有页面默认不收录
    values:
      sitemap: false

  - scope:
      path: "index.html"
    values:
      sitemap: true
      last_modified_at: "now"

- scope: { path: "publication.html" }    values: { sitemap: true }
- scope: { path: "research.html" } values: { sitemap: true }
- scope: { path: "resource.html" } values: { sitemap: true }
