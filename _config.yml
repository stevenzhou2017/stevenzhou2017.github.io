# =========================
# SITE IDENTITY (GRAPH ROOT)
# =========================
title: 周均扬博士 | Dr. Junyang Zhou
description: >-
  Industrial AI | Smart Manufacturing | Vision Systems | CUDA Optimization | 25+年AI领导经验 | 锂电池智能制造 | 具身智能
url: "https://stevenzhou2017.github.io"
baseurl: ""

timezone: Asia/Shanghai

# =========================
# SEO PLUGINS
# =========================
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# =========================
# COLLECTIONS (GRAPH NODES)
# =========================
collections:
  docs:
    output: true
  research:
    output: true
  publications:
    output: true
  projects:
    output: true

# =========================
# DEFAULTS (GRAPH SEMANTIC LAYER)
# =========================
defaults:

  # GLOBAL NODES
  - scope:
      path: ""
    values:
      sitemap: true

  # RESEARCH (HIGHEST SEMANTIC WEIGHT)
  - scope:
      path: "research"
    values:
      layout: page
      category: research
      graph_type: research
      priority: 0.95
      ai_embedding_group: intelligence_systems

  # DOCS (ENGINEERING GRAPH)
  - scope:
      path: "docs"
    values:
      layout: page
      category: docs
      graph_type: engineering
      priority: 0.85
      ai_embedding_group: system_engineering

  # PUBLICATIONS (AUTHORITY NODES)
  - scope:
      path: "publications"
    values:
      layout: page
      category: publications
      graph_type: authority
      priority: 1.0
      ai_embedding_group: academic_output

  # PROJECTS (APPLICATION LAYER)
  - scope:
      path: "projects"
    values:
      layout: page
      category: projects
      graph_type: application
      priority: 0.8
      ai_embedding_group: product_systems

# =========================
# SITEMAP CONTROL (GRAPH-AWARE)
# =========================
sitemap:
  filename: sitemap.xml
  exclude:
    - /assets/
    - /audio/
    - /award/
    - /download/demo/
    - /download/entertainment/
    - /download/latex/
    - /download/thesis/master/
    - /github-recovery-codes.html
    - /github-recovery-codes.md
    - /googleaa9643b011ea1a36.html
    - /test.html

# =========================
# BUILD SETTINGS
# =========================
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# =========================
# EXCLUDE (MINIMAL PRINCIPLE)
# =========================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

# =========================
# SEO SIGNAL BOOST
# =========================
future: true
