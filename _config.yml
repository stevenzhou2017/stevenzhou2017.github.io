plugins:
  - jekyll-sitemap

# ==================== 排除不需要的页面 ====================
exclude:
  - github-recovery-codes.html
  - cgi-bin/
  - header.html
  - assets/
  - docs/2025/          # 先排除旧的笔记页，可逐步放开
  - docs/2026/          # 暂时全部排除（等你完善后再移除）

# 只对核心页面开启 sitemap
defaults:
  - scope:
      path: ""                    # 所有页面默认
    values:
      sitemap: false              # 默认不收录

  - scope:
      path: "index.html"          # 只收录核心页面
    values:
      sitemap: true
      last_modified_at: "now"     # 强制更新时间

  - scope:
      path: "award.html"
    values:
      sitemap: true

  - scope:
      path: "research.html"
    values:
      sitemap: true

  - scope:
      path: "publication.html"
    values:
      sitemap: true

  - scope:
      path: "resource.html"
    values:
      sitemap: true

  - scope:
      path: "links.html"
    values:
      sitemap: true

  - scope:
      path: "teaching.html"
    values:
      sitemap: true
