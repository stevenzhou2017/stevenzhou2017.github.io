# =========================
# SITE IDENTITY (GRAPH ROOT)
# =========================
title: "周均扬博士 | Dr. Junyang Zhou"
description: >-
  Industrial AI Researcher | Vision Operating System | AI Agent | 
  Industrial Vision | CUDA | Embodied AI | 25+ Years in Intelligent Manufacturing
url: "https://stevenzhou2017.github.io"
baseurl: ""
timezone: Asia/Shanghai
lang: zh-CN
locale: zh_CN

author:
  name: Dr. Junyang Zhou
  email: junyang.zhou@gmail.com
  github: stevenzhou2017
  linkedin: junyang-zhou-2593a9100
  bio: >-
    Industrial AI researcher and engineering leader specializing in 
    Vision Operating System, AI Agents, and Intelligent Manufacturing.

# =========================
# SOCIAL & OPEN GRAPH
# =========================
social:
  github: stevenzhou2017
  linkedin: junyang-zhou-2593a9100
  email: junyang.zhou@gmail.com

# Default Open Graph image
default_og_image: /assets/images/Industrial_AI_expert.webp

# =========================
# SEO & PLUGINS
# =========================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links   # 推荐添加，提升内部链接体验

# =========================
# COLLECTIONS (KNOWLEDGE GRAPH NODES)
# =========================
collections:
  docs:
    output: true
    permalink: /docs/:path/
  research:
    output: true
    permalink: /research/:path/
  publications:
    output: true
    permalink: /publications/:path/
  projects:
    output: true
    permalink: /projects/:path/

# =========================
# DEFAULT FRONT MATTER
# =========================
defaults:
  # Global
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/default-og.webp

  # Home
  - scope:
      path: "index.html"
    values:
      sitemap_priority: 1.0
      layout: home

  # Research (高权重)
  - scope:
      path: "research"
    values:
      layout: page
      category: research
      graph_type: research
      sitemap_priority: 0.95

  # Documentation (工程文档)
  - scope:
      path: "docs"
    values:
      layout: page
      category: docs
      graph_type: engineering
      sitemap_priority: 0.90

  # Publications
  - scope:
      path: "publications"
    values:
      layout: page
      category: publications
      graph_type: authority
      sitemap_priority: 1.0

  # Projects
  - scope:
      path: "projects"
    values:
      layout: page
      category: projects
      graph_type: application
      sitemap_priority: 0.85

# =========================
# SITEMAP & SEO
# =========================
sitemap:
  filename: sitemap.xml
  exclude:
    - /audio/
    - /award/
    - /download/demo/
    - /download/entertainment/
    - /download/latex/
    - /download/thesis/master/
    - /projects/algorithmsdk/
    - /googleaa9643b011ea1a36.html

# =========================
# BUILD SETTINGS
# =========================
markdown: kramdown
highlighter: rouge
permalink: pretty                # 更友好的 URL（无 .html）

incremental: false                # 加快本地构建速度
future: false                     # 显示未来文章（便于提前发布）

# Sass 配置
sass:
  sass_dir: _sass
  style: compressed              # 生产环境压缩 CSS

# =========================
# EXCLUDE
# =========================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .github
  - .jekyll-cache
  - .sass-cache
  - audio/
  - award/
  - download/demo/
  - download/entertainment/
  - download/latex/
  - download/thesis/master/
  - projects/algorithmsdk/
  - googleaa9643b011ea1a36.html
  - Framework.txt
  - Framework2.md
  - Information_Architecture.txt

# =========================
# ADDITIONAL OPTIMIZATIONS
# =========================
# Compress HTML (需添加 jekyll-compress-html 插件)
# compress_html:
#   clippings: all
#   comments: all
#   endings: all
#   profile: false
#   blanklines: false
