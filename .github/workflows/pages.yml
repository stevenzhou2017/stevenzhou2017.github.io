name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Inspect _site before upload
        run: |
          echo "==== _site size ===="
          du -sh ./_site

          echo "==== file count ===="
          find ./_site -type f | wc -l

          echo "==== symlinks ===="
          find ./_site -type l -print

          echo "==== hard links ===="
          find ./_site -type f -links +1 -print

          echo "==== files larger than 50MB ===="
          find ./_site -type f -size +50M -print

          echo "==== top 30 largest files ===="
          find ./_site -type f -printf '%s %p\n' | sort -nr | head -30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
